name: Build EduWork source
run-name: CI selection probe - ${{ inputs.scenario || github.event.head_commit.message }}
on:
  push:
    branches: [ci/verify-product-selection]
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        default: success
        options: [success, selection-failure, downstream-failure, cancel]
permissions:
  contents: read
concurrency:
  group: validate-local-web-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
      integration: ${{ steps.changes.outputs.integration }}
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - id: changes
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [[ "$SCENARIO" == selection-failure ]]; then
            printf '{invalid' > "$RUNNER_TEMP/invalid-event.json"
            GITHUB_EVENT_PATH="$RUNNER_TEMP/invalid-event.json" node scripts/ci-changes.mjs
          else
            node scripts/ci-changes.mjs
          fi
  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        slot: [first, second]
    runs-on: ubuntu-latest
    steps:
      - name: Exercise Actions job scheduling with synthetic work
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [[ "$SCENARIO" == downstream-failure ]]; then exit 1; fi
          if [[ "$SCENARIO" == cancel ]]; then sleep 300; fi
          echo 'Synthetic scheduling check completed'
  integration:
    needs: select
    if: needs.select.outputs.integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Synthetic integration scheduling check completed'
  package:
    needs: select
    if: needs.select.outputs.packages == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Synthetic package scheduling check completed'
  result:
    if: always()
    needs: [select, build, integration, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify build result
        run: node scripts/ci-result.mjs
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          REQUIRED: ${{ needs.select.outputs.build }}
          RESULTS: ${{ format('["{0}"]', needs.build.result) }}
      - name: Verify integration result
        run: node scripts/ci-result.mjs
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          REQUIRED: ${{ needs.select.outputs.integration }}
          RESULTS: ${{ format('["{0}"]', needs.integration.result) }}
      - name: Verify package result
        run: node scripts/ci-result.mjs
        env:
          SELECTION_RESULT: ${{ needs.select.result }}
          REQUIRED: ${{ needs.select.outputs.packages }}
          RESULTS: ${{ format('["{0}"]', needs.package.result) }}
